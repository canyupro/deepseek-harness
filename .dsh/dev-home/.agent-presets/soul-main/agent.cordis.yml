#
# 工具行：preset 是 agent 平面组成的载体，会话工具来自 preset 行（对照随包
#   standard preset）。soul-main 只装只读认知链路所需最小集：
#   tool-fs（read/edit/write/read_image）、tool-fs-search（grep/glob）、
#   tool-bash（bash）。三行都只向 host `tools` 注册表登记、不发布服务，
#   按 standard 的先例平铺、不加 isolate realm。写入边界由附加规则的
#   正式资产保护条款约束（Demo v0 对正式资产永远只出候选）。
